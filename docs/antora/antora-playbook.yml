site:
  title: Q Docs
  start_page: q::index.adoc
  url: https://www.cycfi.com/
content:
  sources:
  - url: https://github.com/cycfi/q.git
    # develop is the version in development, master the newest release.
    # Each carries one docs version, so they never collide, and the stable
    # docs follow master when it moves to a new release.
    branches: [develop, master]
    start_path: docs
ui:
  supplemental_files: ./supplemental-ui
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
antora:
  extensions:
  - '@antora/lunr-extension'
