<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- The messages arrive in order down the list; each one reaches the
       overload written for its type, or the inherited catch-all. -->


  <rect x="20" y="78" width="180" height="176" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="96" font-size="15" fill="#1a1a1a" text-anchor="middle">note_on</text>
  <text x="110" y="111" font-size="11" fill="#5d5d5d" text-anchor="middle">key 60</text>
  <line x1="20" y1="122" x2="200" y2="122" stroke="#1565c0" stroke-width="0.75"/>
  <text x="110" y="140" font-size="15" fill="#1a1a1a" text-anchor="middle">note_on</text>
  <text x="110" y="155" font-size="11" fill="#5d5d5d" text-anchor="middle">key 64</text>
  <line x1="20" y1="166" x2="200" y2="166" stroke="#1565c0" stroke-width="0.75"/>
  <text x="110" y="184" font-size="15" fill="#1a1a1a" text-anchor="middle">control_change</text>
  <text x="110" y="199" font-size="11" fill="#5d5d5d" text-anchor="middle">7, volume</text>
  <line x1="20" y1="210" x2="200" y2="210" stroke="#1565c0" stroke-width="0.75"/>
  <text x="110" y="228" font-size="15" fill="#1a1a1a" text-anchor="middle">program_change</text>
  <text x="110" y="243" font-size="11" fill="#5d5d5d" text-anchor="middle">program 5</text>

  <rect x="330" y="40" width="370" height="250" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="515" y="66" font-size="16" fill="#1a1a1a" text-anchor="middle">my_midi_processor</text>
  <text x="515" y="84" font-size="11" fill="#5d5d5d" text-anchor="middle">derives from midi::processor</text>

  <rect x="346" y="100" width="338" height="44" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="515" y="127" font-size="15" fill="#1a1a1a" text-anchor="middle">operator()(note_on, time)</text>

  <rect x="346" y="160" width="338" height="44" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="515" y="187" font-size="15" fill="#1a1a1a" text-anchor="middle">operator()(control_change, time)</text>

  <rect x="346" y="220" width="338" height="52" rx="8" fill="#f3f3f3" stroke="#5d5d5d" stroke-width="1.5"/>
  <text x="515" y="242" font-size="15" fill="#1a1a1a" text-anchor="middle">operator()(message_base, time)</text>
  <text x="515" y="257" font-size="11" fill="#5d5d5d" text-anchor="middle">inherited, takes anything else and ignores it</text>

  <!-- which message reaches which overload -->
  <path d="M 202,100 L 234,100 Q 240,100 240,106 L 240,106 Q 240,112 246,112 L 335,112" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="346,112 335,107 335,117" fill="#1a1a1a"/>
  <path d="M 202,144 L 234,144 Q 240,144 240,138 L 240,138 Q 240,132 246,132 L 335,132" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="346,132 335,127 335,137" fill="#1a1a1a"/>
  <path d="M 202,188 L 259,188 Q 262,188 262,185 L 262,185 Q 262,182 265,182 L 335,182" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="346,182 335,177 335,187" fill="#1a1a1a"/>
  <text x="254" y="224" font-size="11" fill="#5d5d5d" text-anchor="middle">unimplemented</text>
  <path d="M 202,232 L 277,232 Q 284,232 284,239 L 284,239 Q 284,246 291,246 L 335,246" fill="none" stroke="#5d5d5d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="346,246 335,241 335,251" fill="#5d5d5d"/>
</svg>
