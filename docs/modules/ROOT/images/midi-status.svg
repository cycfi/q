<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- The status byte, on the same grid: two nibbles of 320 px from x = 70. -->
  <line x1="70" y1="20" x2="710" y2="20" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="70" y1="14" x2="70" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="710" y1="14" x2="710" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="340" y="8" width="100" height="22" fill="#ffffff"/>
  <text x="390" y="25" font-size="14" fill="#5d5d5d" text-anchor="middle">status byte</text>

  <text x="10" y="68" font-size="14" fill="#5d5d5d">bits</text>

  <rect x="70"  y="40" width="320" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">status</text>

  <rect x="390" y="40" width="320" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="550" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">channel</text>

  <!-- bit scale -->
  <text x="70"  y="106" font-size="13" fill="#5d5d5d" text-anchor="middle">7</text>
  <text x="390" y="106" font-size="13" fill="#5d5d5d" text-anchor="middle">4</text>
  <text x="710" y="106" font-size="13" fill="#5d5d5d" text-anchor="middle">0</text>
</svg>
