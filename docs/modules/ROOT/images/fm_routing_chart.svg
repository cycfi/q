<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -34 720 464" width="720" height="464" font-family="Helvetica, Arial, sans-serif">

  <!-- The DX7's algorithm 1, drawn as its chart draws it, with the
       fm_routing expression that says the same thing. Hand-authored SVG:
       round-rect boxes (rx 8), baked arrowhead polygons, no <marker>.
       Palette: audio path #1565c0 on #e8f2fd, carriers #43a047 on #f1f8f2,
       feedback #b07000 on #fff8e1. -->

  <!-- modulators, left stack: OP2 -->
  <rect x="120" y="150" width="96" height="44" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="168" y="178" text-anchor="middle" font-size="17" fill="#1a1a1a">OP2</text>

  <!-- carrier, left: OP1 -->
  <rect x="120" y="245" width="96" height="44" rx="8" fill="#f1f8f2" stroke="#43a047" stroke-width="1.6"/>
  <text x="168" y="273" text-anchor="middle" font-size="17" fill="#1a1a1a">OP1</text>

  <!-- modulators, right stack: OP6, OP5, OP4 -->
  <rect x="330" y="20" width="96" height="44" rx="8" fill="#fff8e1" stroke="#b07000" stroke-width="1.6"/>
  <text x="378" y="48" text-anchor="middle" font-size="17" fill="#1a1a1a">OP6</text>

  <rect x="330" y="95" width="96" height="44" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="378" y="123" text-anchor="middle" font-size="17" fill="#1a1a1a">OP5</text>

  <rect x="330" y="170" width="96" height="44" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="378" y="198" text-anchor="middle" font-size="17" fill="#1a1a1a">OP4</text>

  <!-- carrier, right: OP3 -->
  <rect x="330" y="245" width="96" height="44" rx="8" fill="#f1f8f2" stroke="#43a047" stroke-width="1.6"/>
  <text x="378" y="273" text-anchor="middle" font-size="17" fill="#1a1a1a">OP3</text>

  <!-- modulation paths, downward -->
  <line x1="168" y1="194" x2="168" y2="235" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="168,245 163,234 173,234" fill="#1a1a1a"/>

  <line x1="378" y1="64" x2="378" y2="85" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="378,95 373,84 383,84" fill="#1a1a1a"/>

  <line x1="378" y1="139" x2="378" y2="160" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="378,170 373,159 383,159" fill="#1a1a1a"/>

  <line x1="378" y1="214" x2="378" y2="235" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="378,245 373,234 383,234" fill="#1a1a1a"/>

  <!-- the feedback loop on OP6, out of its right side and back into its top -->
  <path d="M 426 42 H 512 V -22 H 378 V 9" fill="none" stroke="#b07000" stroke-width="1.4"/>
  <polygon points="378,20 383,9 373,9" fill="#b07000"/>
  <text x="522" y="46" font-size="13" fill="#b07000">feedback</text>

  <!-- the carriers sum to the output -->
  <line x1="168" y1="289" x2="168" y2="335" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="378" y1="289" x2="378" y2="335" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="168" y1="335" x2="378" y2="335" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="273" y1="335" x2="273" y2="358" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="273,368 268,357 278,357" fill="#1a1a1a"/>
  <text x="290" y="366" font-size="13" fill="#5d5d5d">the sum of the carriers</text>

  <!-- what the two box colours mean -->
  <rect x="540" y="150" width="16" height="16" rx="4" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="566" y="163" font-size="13" fill="#5d5d5d">modulates another</text>
  <rect x="540" y="180" width="16" height="16" rx="4" fill="#f1f8f2" stroke="#43a047" stroke-width="1.4"/>
  <text x="566" y="193" font-size="13" fill="#5d5d5d">modulates nothing,</text>
  <text x="566" y="210" font-size="13" fill="#5d5d5d">so it sounds</text>

  <!-- the same chart as an expression -->
  <text x="20" y="404" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1a1a1a">(op2 &gt;&gt; op1 | op6 &gt;&gt; op5 &gt;&gt; op4 &gt;&gt; op3).feedback(op6)</text>
</svg>
