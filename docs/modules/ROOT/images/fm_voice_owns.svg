<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Helvetica, Arial, sans-serif">

  <!-- What a voice owns and what the caller keeps: the dashed box is the
       voice, holding the operators, the algorithm, the LFO and the pitch
       envelope; the pitch and the note come from outside it.
       Hand-authored SVG: round-rect boxes (rx 8), baked arrowhead
       polygons, no <marker>. Palette: the operators #1565c0 on #e8f2fd,
       the pitch envelope #43a047 on #f1f8f2, the LFO #b07000 on #fff8e1,
       the rest #5d5d5d on #f4f4f4. -->

  <!-- the voice itself -->
  <rect x="140" y="30" width="560" height="240" rx="14" fill="#fcfcfd" stroke="#5d5d5d" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="152" y="50" font-size="14" font-family="Menlo, Consolas, monospace" fill="#5d5d5d">fm_voice</text>

  <!-- what it takes from the caller -->
  <text x="14" y="126" font-size="11" fill="#5d5d5d">the caller's</text>
  <text x="14" y="146" font-size="14" fill="#1a1a1a">master</text>
  <text x="14" y="162" font-size="12" fill="#5d5d5d">phase_iterator</text>
  <line x1="110" y1="152" x2="159" y2="152" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="170,152 159,147 159,157" fill="#1a1a1a"/>

  <text x="14" y="234" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1a1a1a">attack(note)</text>
  <text x="14" y="250" font-size="11" fill="#5d5d5d">a ratio and an envelope</text>
  <text x="14" y="264" font-size="11" fill="#5d5d5d">for every operator</text>
  <line x1="110" y1="228" x2="389" y2="228" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="400,228 389,223 389,233" fill="#1a1a1a"/>

  <!-- the pitch envelope, in semitones -->
  <rect x="170" y="58" width="110" height="44" rx="8" fill="#f1f8f2" stroke="#43a047" stroke-width="1.6"/>
  <text x="225" y="80" text-anchor="middle" font-size="15" fill="#1a1a1a">pitch env</text>
  <text x="225" y="95" text-anchor="middle" font-size="11" fill="#5d5d5d">semitones</text>
  <line x1="225" y1="102" x2="225" y2="119" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="225,130 220,119 230,119" fill="#1a1a1a"/>

  <!-- the LFO, which the voice runs once a sample -->
  <rect x="300" y="58" width="96" height="44" rx="8" fill="#fff8e1" stroke="#b07000" stroke-width="1.6"/>
  <text x="348" y="86" text-anchor="middle" font-size="16" fill="#1a1a1a">LFO</text>
  <line x1="348" y1="102" x2="348" y2="119" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="348,130 343,119 353,119" fill="#1a1a1a"/>
  <text x="340" y="118" text-anchor="end" font-size="11" fill="#5d5d5d">vibrato</text>

  <path d="M 396 80 H 540 V 99" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="540,110 535,99 545,99" fill="#1a1a1a"/>
  <text x="550" y="94" font-size="11" fill="#5d5d5d">tremolo, on each</text>
  <text x="550" y="107" font-size="11" fill="#5d5d5d">operator's gain</text>

  <!-- the pitch the operators follow -->
  <rect x="170" y="130" width="200" height="44" rx="8" fill="#f4f4f4" stroke="#5d5d5d" stroke-width="1.6"/>
  <text x="270" y="158" text-anchor="middle" font-size="15" fill="#1a1a1a">bent pitch</text>
  <line x1="370" y1="152" x2="389" y2="152" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="400,152 389,147 389,157" fill="#1a1a1a"/>

  <!-- the algorithm, and the operators it runs -->
  <rect x="400" y="110" width="270" height="140" rx="10" fill="#f8f8f8" stroke="#5d5d5d" stroke-width="1.4"/>
  <text x="412" y="130" font-size="14" font-family="Menlo, Consolas, monospace" fill="#5d5d5d">algorithm</text>
  <text x="412" y="145" font-size="11" fill="#5d5d5d">routing, index, feedback</text>

  <rect x="412" y="176" width="72" height="40" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="448" y="201" text-anchor="middle" font-size="14" fill="#1a1a1a">op 1</text>
  <rect x="496" y="176" width="72" height="40" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="532" y="201" text-anchor="middle" font-size="14" fill="#1a1a1a">op 2</text>
  <text x="588" y="201" text-anchor="middle" font-size="15" fill="#5d5d5d">...</text>
  <rect x="612" y="176" width="46" height="40" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="635" y="201" text-anchor="middle" font-size="14" fill="#1a1a1a">N</text>

  <text x="535" y="238" text-anchor="middle" font-size="11" fill="#5d5d5d">each with its own phase and envelope</text>

  <!-- one sample out -->
  <line x1="670" y1="152" x2="703" y2="152" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="714,152 703,147 703,157" fill="#1a1a1a"/>
  <text x="676" y="142" font-size="12" fill="#5d5d5d">out</text>
</svg>
