<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- A processor is written for one protocol; a translator lets either
       kind of stream reach it. -->

  <rect x="20" y="50" width="160" height="52" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="100" y="81" font-size="15" fill="#1a1a1a" text-anchor="middle">MIDI 2.0 stream</text>
  <rect x="300" y="50" width="140" height="52" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="370" y="81" font-size="15" fill="#1a1a1a" text-anchor="middle">to_midi1</text>
  <rect x="560" y="50" width="140" height="52" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="630" y="72" font-size="15" fill="#1a1a1a" text-anchor="middle">processor</text>
  <text x="630" y="87" font-size="11" fill="#5d5d5d" text-anchor="middle">written for MIDI 1.0</text>
  <line x1="182" y1="76" x2="289" y2="76" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="300,76 289,71 289,81" fill="#1a1a1a"/>
  <line x1="442" y1="76" x2="549" y2="76" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="560,76 549,71 549,81" fill="#1a1a1a"/>
  <rect x="20" y="160" width="160" height="52" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="100" y="191" font-size="15" fill="#1a1a1a" text-anchor="middle">MIDI 1.0 stream</text>
  <rect x="300" y="160" width="140" height="52" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="370" y="191" font-size="15" fill="#1a1a1a" text-anchor="middle">to_midi2</text>
  <rect x="560" y="160" width="140" height="52" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="630" y="182" font-size="15" fill="#1a1a1a" text-anchor="middle">processor</text>
  <text x="630" y="197" font-size="11" fill="#5d5d5d" text-anchor="middle">written for MIDI 2.0</text>
  <line x1="182" y1="186" x2="289" y2="186" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="300,186 289,181 289,191" fill="#1a1a1a"/>
  <line x1="442" y1="186" x2="549" y2="186" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="560,186 549,181 549,191" fill="#1a1a1a"/>
</svg>
