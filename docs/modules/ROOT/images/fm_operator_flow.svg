<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Helvetica, Arial, sans-serif">

  <!-- One fm_operator, one sample: the master's step times ratio advances
       the operator's own phase, the modulation offset is added, the
       oscillator is called at that phase, and the envelope scales it.
       Hand-authored SVG: round-rect boxes (rx 8), baked arrowhead
       polygons, no <marker>. Palette: phase domain #5d5d5d on #f4f4f4,
       the oscillator #1565c0 on #e8f2fd, the envelope #43a047 on
       #f1f8f2. -->

  <!-- the master phase iterator comes in from the caller -->
  <text x="14" y="126" font-size="15" fill="#1a1a1a">master</text>
  <text x="14" y="144" font-size="12" fill="#5d5d5d">phase_iterator</text>
  <line x1="110" y1="130" x2="119" y2="130" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="130,130 119,125 119,135" fill="#1a1a1a"/>

  <!-- its step, scaled to this operator's frequency -->
  <rect x="130" y="108" width="96" height="44" rx="8" fill="#f4f4f4" stroke="#5d5d5d" stroke-width="1.6"/>
  <text x="178" y="136" text-anchor="middle" font-size="16" fill="#1a1a1a">&#215; ratio</text>

  <line x1="226" y1="130" x2="261" y2="130" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="272,130 261,125 261,135" fill="#1a1a1a"/>

  <!-- the operator's own phase, advanced by that step every sample -->
  <rect x="272" y="108" width="110" height="44" rx="8" fill="#f4f4f4" stroke="#5d5d5d" stroke-width="1.6"/>
  <text x="327" y="128" text-anchor="middle" font-size="16" fill="#1a1a1a">phase</text>
  <text x="327" y="143" text-anchor="middle" font-size="11" fill="#5d5d5d">+ step</text>

  <!-- a fixed frequency goes straight to the phase, ignoring the master -->
  <text x="150" y="200" font-size="13" font-family="Menlo, Consolas, monospace" fill="#5d5d5d">fixed(step)</text>
  <path d="M 240 196 H 327 V 162" fill="none" stroke="#5d5d5d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="327,152 322,163 332,163" fill="#5d5d5d"/>

  <!-- this sample's modulation, a phase offset -->
  <text x="420" y="46" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1a1a1a">modulation(mod)</text>
  <line x1="420" y1="58" x2="420" y2="104" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="420,115 415,104 425,104" fill="#1a1a1a"/>

  <line x1="382" y1="130" x2="394" y2="130" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="405,130 394,125 394,135" fill="#1a1a1a"/>
  <circle cx="420" cy="130" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="411" y1="130" x2="429" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="420" y1="121" x2="420" y2="139" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="435" y1="130" x2="449" y2="130" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="460,130 449,125 449,135" fill="#1a1a1a"/>

  <!-- the oscillator, called at that phase -->
  <rect x="460" y="108" width="96" height="44" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="508" y="136" text-anchor="middle" font-size="17" fill="#1a1a1a">osc</text>

  <line x1="556" y1="130" x2="568" y2="130" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="579,130 568,125 568,135" fill="#1a1a1a"/>
  <circle cx="594" cy="130" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="588" y1="124" x2="600" y2="136" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="600" y1="124" x2="588" y2="136" stroke="#1a1a1a" stroke-width="2"/>

  <text x="640" y="121" font-size="13" fill="#5d5d5d">out</text>
  <line x1="609" y1="130" x2="689" y2="130" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="700,130 689,125 689,135" fill="#1a1a1a"/>

  <!-- the envelope, which carries the operator's level and its gain -->
  <rect x="546" y="226" width="96" height="44" rx="8" fill="#f1f8f2" stroke="#43a047" stroke-width="1.6"/>
  <text x="594" y="254" text-anchor="middle" font-size="17" fill="#1a1a1a">env</text>
  <line x1="594" y1="226" x2="594" y2="156" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="594,145 589,156 599,156" fill="#1a1a1a"/>

  <text x="520" y="252" text-anchor="end" font-size="12" fill="#5d5d5d">attack, release, gain</text>
  <line x1="526" y1="248" x2="535" y2="248" stroke="#5d5d5d" stroke-width="1.4"/>
  <polygon points="546,248 535,243 535,253" fill="#5d5d5d"/>

  <!-- the same flow as the call -->
  <text x="20" y="302" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1a1a1a">y = osc(phase + mod) * env()</text>
</svg>
