  <polygon points="230,164 219,159 219,169" fill="#1a1a1a"/>
  <rect x="420" y="75" width="160" height="70" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="500" y="96" font-size="13" fill="#1a1a1a" text-anchor="middle">note_pitch</text>
  <text x="500" y="111" font-size="13" fill="#1a1a1a" text-anchor="middle">note_pressure</text>
