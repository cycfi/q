  <text x="95" y="67" font-size="11" fill="#5d5d5d" text-anchor="middle">a channel per note</text>
  <rect x="20" y="138" width="150" height="52" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="95" y="160" font-size="15" fill="#1a1a1a" text-anchor="middle">MIDI 2.0</text>
  <text x="95" y="175" font-size="11" fill="#5d5d5d" text-anchor="middle">per-note messages</text>
  <rect x="230" y="30" width="130" height="52" rx="8" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="295" y="61" font-size="15" fill="#1a1a1a" text-anchor="middle">mpe_reader</text>
