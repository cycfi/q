<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 620 225"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .slot     { fill: #ffffff; stroke: #b07000; stroke-width: 1.5; }
      .name     { font-size: 15px; fill: #1a1a1a; }
      .sub      { font-size: 13px; fill: #5d5d5d; }
      .onDark   { font-size: 13px; fill: #e8e8e8; }
      .link     { fill: none; stroke: #1a1a1a; stroke-width: 1.5;
                   stroke-linecap: round; }
      .tip      { fill: #1a1a1a; }
      .frame    { fill: none; stroke: #b0b0b0; stroke-width: 1; }
    </style>
  </defs>

  <image x="10" y="25" width="255" height="180" xlink:href="data:image/png;base64,"/>
  <rect class="frame" x="10" y="25" width="255" height="180"/>

  <text class="onDark" x="61" y="36">attack</text>
  <text class="onDark" x="114" y="109">decay, sustain</text>
  <text class="onDark" x="258" y="201" text-anchor="end">release</text>

  <text class="sub" x="297" y="108" text-anchor="middle">four values</text>
  <line class="link" x1="265" y1="116" x2="330" y2="116"/>
  <line class="link" x1="330" y1="42" x2="330" y2="174"/>

  <line class="link" x1="330" y1="42" x2="350" y2="42"/>
  <polygon class="tip" points="360,42 350,37 350,47"/>
  <line class="link" x1="330" y1="86" x2="350" y2="86"/>
  <polygon class="tip" points="360,86 350,81 350,91"/>
  <line class="link" x1="330" y1="130" x2="350" y2="130"/>
  <polygon class="tip" points="360,130 350,125 350,135"/>
  <line class="link" x1="330" y1="174" x2="350" y2="174"/>
  <polygon class="tip" points="360,174 350,169 350,179"/>

  <rect class="slot" x="360" y="25" width="240" height="34"/>
  <text class="name" x="480" y="47" text-anchor="middle">attack_of(env)</text>
  <rect class="slot" x="360" y="69" width="240" height="34"/>
  <text class="name" x="480" y="91" text-anchor="middle">decay_of(env)</text>
  <rect class="slot" x="360" y="113" width="240" height="34"/>
  <text class="name" x="480" y="135" text-anchor="middle">sustain_of(env)</text>
  <rect class="slot" x="360" y="157" width="240" height="34"/>
  <text class="name" x="480" y="179" text-anchor="middle">release_of(env)</text>

  <text class="sub" x="480" y="213" text-anchor="middle">each bound like a slider</text>
</svg>
