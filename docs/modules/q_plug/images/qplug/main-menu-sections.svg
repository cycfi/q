<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 306"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .panel  { fill: #ffffff; stroke: #b0b0b0; stroke-width: 1.5; }
      .item   { font-size: 15px; fill: #1a1a1a; }
      .key    { font-size: 15px; fill: #5d5d5d; }
      .sub    { font-size: 13px; fill: #5d5d5d; }
      .name   { font-size: 14px; fill: #1a1a1a; }
      .rule   { stroke: #d0d0d0; stroke-width: 1; }
      .empty  { fill: none; stroke: #b0b0b0; stroke-width: 1.2;
                 stroke-dasharray: 5 4; }
      .link   { fill: none; stroke: #1a1a1a; stroke-width: 1.5;
                 stroke-linecap: round; }
      .tip    { fill: #1a1a1a; }
    </style>
  </defs>

  <rect class="panel" x="30" y="14" width="300" height="270" rx="4"/>

  <text class="item" x="54" y="46">Save Preset As...</text>
  <text class="item" x="54" y="76">Delete Preset</text>
  <line class="rule" x1="30" y1="92" x2="330" y2="92"/>

  <text class="item" x="54" y="122">Zoom In</text>
  <text class="key"  x="306" y="122" text-anchor="end">⌘ =</text>
  <text class="item" x="54" y="152">Zoom Out</text>
  <text class="key"  x="306" y="152" text-anchor="end">⌘ -</text>
  <text class="item" x="54" y="182">Actual Size</text>
  <text class="key"  x="306" y="182" text-anchor="end">⌘ 0</text>
  <line class="rule" x1="30" y1="198" x2="330" y2="198"/>

  <rect class="empty" x="44" y="208" width="272" height="30" rx="3"/>
  <text class="sub" x="180" y="228" text-anchor="middle">nothing here in the base</text>

  <text class="item" x="54" y="268">About QPlug VA Synth 5...</text>

  <line class="link" x1="340" y1="60" x2="386" y2="60"/>
  <polygon class="tip" points="396,60 386,55 386,65"/>
  <text class="name" x="404" y="65">preset_menu_items</text>

  <line class="link" x1="340" y1="150" x2="386" y2="150"/>
  <polygon class="tip" points="396,150 386,145 386,155"/>
  <text class="name" x="404" y="155">view_menu_items</text>

  <line class="link" x1="340" y1="223" x2="386" y2="223"/>
  <polygon class="tip" points="396,223 386,218 386,228"/>
  <text class="name" x="404" y="228">plugin_menu_items</text>

  <line class="link" x1="340" y1="262" x2="386" y2="262"/>
  <polygon class="tip" points="396,262 386,257 386,267"/>
  <text class="name" x="404" y="267">about_menu_items</text>
</svg>
