<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 202"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>
  <defs>
    <style>
      .box    { stroke-width: 1.5; }
      .audio  { fill: #e8f2fd; stroke: #1565c0; }
      .hub    { fill: #fff8e1; stroke: #b07000; }
      .ui     { fill: #eaf6ea; stroke: #43a047; }
      .label  { font-size: 18px; fill: #1a1a1a; }
      .sub    { font-size: 13px; fill: #5d5d5d; }
      .flag   { font-size: 13px; fill: #e53935; }
      .link   { fill: none; stroke: #1a1a1a; stroke-width: 1.5;
                 stroke-linecap: round; }
      .tip    { fill: #1a1a1a; }
      .none   { fill: none; stroke: #e53935; stroke-width: 1.5;
                 stroke-dasharray: 4 4; }
      .cross  { fill: none; stroke: #e53935; stroke-width: 1.5;
                 stroke-linecap: round; }
    </style>
  </defs>

  <rect class="box hub" x="190" y="20" width="140" height="46" rx="8"/>
  <text class="label" x="260" y="49" text-anchor="middle">controller</text>

  <rect class="box audio" x="25" y="122" width="140" height="46" rx="8"/>
  <text class="label" x="95" y="151" text-anchor="middle">processor</text>

  <rect class="box ui" x="355" y="122" width="140" height="46" rx="8"/>
  <text class="label" x="425" y="151" text-anchor="middle">presenter</text>

  <path class="link" d="M 190 43 L 115 43 Q 95 43 95 63 L 95 113"/>
  <polygon class="tip" points="95,122 90,112 100,112"/>

  <path class="link" d="M 330 43 L 405 43 Q 425 43 425 63 L 425 113"/>
  <polygon class="tip" points="425,122 420,112 430,112"/>

  <line class="none" x1="172" y1="145" x2="348" y2="145"/>
  <line class="cross" x1="253" y1="138" x2="267" y2="152"/>
  <line class="cross" x1="267" y1="138" x2="253" y2="152"/>
  <text class="flag" x="260" y="172" text-anchor="middle">never see each other</text>

  <text class="sub" x="260" y="13" text-anchor="middle">the hub</text>
  <text class="sub" x="95" y="190" text-anchor="middle">audio thread</text>
  <text class="sub" x="425" y="190" text-anchor="middle">main thread</text>
</svg>
