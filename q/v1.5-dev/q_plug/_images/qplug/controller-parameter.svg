<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .box    { stroke-width: 1.5; }
      .slot   { fill: #ffffff; stroke: #b07000; stroke-width: 1.5; }
      .hub    { fill: #fff8e1; stroke: #b07000; }
      .ui     { fill: #eaf6ea; stroke: #43a047; }
      .host   { fill: #f3f3f3; stroke: #5d5d5d; }
      .label  { font-size: 18px; fill: #1a1a1a; }
      .name   { font-size: 15px; fill: #1a1a1a; }
      .sub    { font-size: 13px; fill: #5d5d5d; }
      .link   { fill: none; stroke: #1a1a1a; stroke-width: 1.5;
                 stroke-linecap: round; }
      .tip    { fill: #1a1a1a; }
    </style>
  </defs>

  <rect class="box hub" x="210" y="20" width="230" height="215" rx="8"/>
  <text class="label" x="325" y="46" text-anchor="middle">controller</text>

  <rect class="slot" x="232" y="62" width="186" height="56"/>
  <text class="name" x="325" y="86" text-anchor="middle">atomic&lt;double&gt;</text>
  <text class="sub" x="325" y="105" text-anchor="middle">the audio thread's value</text>

  <rect class="slot" x="232" y="170" width="186" height="56"/>
  <text class="name" x="325" y="194" text-anchor="middle">value_model&lt;double&gt;</text>
  <text class="sub" x="325" y="213" text-anchor="middle">what a control follows</text>

  <rect class="box host" x="5" y="66" width="95" height="48" rx="8"/>
  <text class="label" x="52" y="96" text-anchor="middle">host</text>

  <rect class="box ui" x="515" y="170" width="100" height="48" rx="8"/>
  <text class="label" x="565" y="200" text-anchor="middle">control</text>

  <line class="link" x1="100" y1="90" x2="222" y2="90"/>
  <polygon class="tip" points="232,90 222,85 222,95"/>
  <text class="sub" x="158" y="82" text-anchor="middle">set_parameter</text>

  <line class="link" x1="325" y1="118" x2="325" y2="160"/>
  <polygon class="tip" points="325,170 320,160 330,160"/>
  <text class="sub" x="335" y="148">update_models</text>

  <line class="link" x1="418" y1="194" x2="505" y2="194"/>
  <polygon class="tip" points="515,194 505,189 505,199"/>
  <text class="sub" x="470" y="214" text-anchor="middle">binding</text>

  <path class="link" d="M 565 170 L 565 60 Q 565 50 555 50 L 450 50"/>
  <polygon class="tip" points="440,50 450,45 450,55"/>
  <text class="sub" x="515" y="42" text-anchor="middle">edit_parameter</text>

  <path class="link" d="M 210 50 L 75 50 Q 65 50 65 56"/>
  <polygon class="tip" points="65,66 60,56 70,56"/>
  <text class="sub" x="137" y="42" text-anchor="middle">edits</text>
</svg>
