<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- A MIDI 2.0 control_change: one packet of two words, the value
       a whole 32 bit word. Same grid as the voice message figure. -->

  <line x1="70" y1="20" x2="710" y2="20" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="70" y1="14" x2="70" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="710" y1="14" x2="710" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="315" y="8" width="150" height="22" fill="#ffffff"/>
  <text x="390" y="25" font-size="14" fill="#5d5d5d" text-anchor="middle">one control_change</text>
  <text x="10" y="68" font-size="14" fill="#5d5d5d">word 0</text>
  <rect x="70" y="40" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">0x4</text>
  <text x="110" y="73" font-size="11" fill="#5d5d5d" text-anchor="middle">type</text>
  <rect x="150" y="40" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="190" y="73" font-size="11" fill="#5d5d5d" text-anchor="middle">group</text>
  <rect x="230" y="40" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="270" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">0xB</text>
  <text x="270" y="73" font-size="11" fill="#5d5d5d" text-anchor="middle">opcode</text>
  <rect x="310" y="40" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="350" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="350" y="73" font-size="11" fill="#5d5d5d" text-anchor="middle">channel</text>
  <rect x="390" y="40" width="160" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="470" y="73" font-size="11" fill="#5d5d5d" text-anchor="middle">modulation</text>
  <rect x="550" y="40" width="160" height="44" fill="#f3f3f3" stroke="#1565c0" stroke-width="1.5"/>
  <text x="630" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="630" y="73" font-size="11" fill="#5d5d5d" text-anchor="middle">reserved</text>
  <text x="10" y="148" font-size="14" fill="#5d5d5d">word 1</text>
  <rect x="70" y="120" width="640" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="390" y="138" font-size="16" fill="#1a1a1a" text-anchor="middle">value</text>
  <text x="390" y="153" font-size="11" fill="#5d5d5d" text-anchor="middle">0 to 4294967295</text>
  <text x="70" y="186" font-size="13" fill="#5d5d5d" text-anchor="middle">31</text>
  <text x="230" y="186" font-size="13" fill="#5d5d5d" text-anchor="middle">24</text>
  <text x="390" y="186" font-size="13" fill="#5d5d5d" text-anchor="middle">16</text>
  <text x="550" y="186" font-size="13" fill="#5d5d5d" text-anchor="middle">8</text>
  <text x="710" y="186" font-size="13" fill="#5d5d5d" text-anchor="middle">0</text>
</svg>
