<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- System exclusive: nothing in it says how long it is, and the
       packet form carries the payload across packets. -->

  <line x1="90" y1="30" x2="630" y2="30" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="90" y1="24" x2="90" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="630" y1="24" x2="630" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="255" y="18" width="210" height="22" fill="#ffffff"/>
  <text x="360" y="35" font-size="14" fill="#5d5d5d" text-anchor="middle">one system exclusive message</text>
  <text x="10" y="84" font-size="14" fill="#5d5d5d">bytes</text>
  <rect x="90" y="56" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="130" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0xF0</text>
  <rect x="170" y="56" width="130" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="235" y="74" font-size="16" fill="#1a1a1a" text-anchor="middle">id</text>
  <text x="235" y="89" font-size="11" fill="#5d5d5d" text-anchor="middle">manufacturer</text>
  <rect x="300" y="56" width="250" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="425" y="74" font-size="16" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="425" y="89" font-size="11" fill="#5d5d5d" text-anchor="middle">as many bytes as it takes</text>
  <rect x="550" y="56" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="590" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0xF7</text>
  <text x="10" y="188" font-size="14" fill="#5d5d5d">packets</text>
  <rect x="90" y="160" width="170" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="175" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">start</text>
  <text x="175" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">six bytes of the payload</text>
  <rect x="280" y="160" width="170" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="365" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">continue</text>
  <text x="365" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">six more</text>
  <rect x="470" y="160" width="170" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="555" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">end</text>
  <text x="555" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">what is left</text>
  <line x1="90" y1="224" x2="630" y2="224" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="90" y1="218" x2="90" y2="230" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="630" y1="218" x2="630" y2="230" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="195" y="212" width="330" height="22" fill="#ffffff"/>
  <text x="360" y="229" font-size="14" fill="#5d5d5d" text-anchor="middle">no 0xF0 or 0xF7: the packet says which piece it is</text>
</svg>
