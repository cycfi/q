<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- One to four 32 bit words on the same grid as the voice message
       figure: 640 px to a word from x = 70, so 20 px to a bit. -->

  <line x1="70" y1="20" x2="710" y2="20" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="70" y1="14" x2="70" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="710" y1="14" x2="710" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="320" y="8" width="140" height="22" fill="#ffffff"/>
  <text x="390" y="25" font-size="14" fill="#5d5d5d" text-anchor="middle">32 bits to a word</text>

  <text x="10" y="68" font-size="14" fill="#5d5d5d">word 0</text>

  <rect x="70"  y="40" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">type</text>

  <rect x="150" y="40" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">group</text>

  <rect x="230" y="40" width="480" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">what the type says</text>

  <!-- bit scale for word 0 -->
  <text x="70"  y="106" font-size="13" fill="#5d5d5d" text-anchor="middle">31</text>
  <text x="150" y="106" font-size="13" fill="#5d5d5d" text-anchor="middle">28</text>
  <text x="230" y="106" font-size="13" fill="#5d5d5d" text-anchor="middle">24</text>
  <text x="710" y="106" font-size="13" fill="#5d5d5d" text-anchor="middle">0</text>

  <text x="10" y="152" font-size="14" fill="#5d5d5d">words</text>
  <text x="10" y="168" font-size="14" fill="#5d5d5d">1 to 3</text>

  <rect x="70" y="124" width="640" height="44" fill="#ffffff" stroke="#1565c0"
        stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="390" y="152" font-size="16" fill="#5d5d5d" text-anchor="middle">as many more as the type has, or none</text>

  <text x="390" y="192" font-size="14" fill="#5d5d5d" text-anchor="middle">a packet is one to four words</text>
</svg>
