<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- packet_message<N>: the words a typed message keeps, and which
       accessor reads which part of the first one. -->

  <text x="10" y="58" font-size="14" fill="#5d5d5d">data[0]</text>

  <rect x="70"  y="30" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">type</text>

  <rect x="150" y="30" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">group</text>

  <rect x="230" y="30" width="480" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">what the message type says</text>

  <text x="10" y="122" font-size="14" fill="#5d5d5d">data[1]</text>
  <text x="10" y="138" font-size="14" fill="#5d5d5d">and on</text>

  <rect x="70" y="94" width="640" height="44" fill="#ffffff" stroke="#1565c0"
        stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="390" y="122" font-size="16" fill="#5d5d5d" text-anchor="middle">the rest, however many the type keeps</text>

  <!-- what reads what -->
  <text x="110" y="166" font-size="13" fill="#5d5d5d" text-anchor="middle">message_type()</text>
  <text x="190" y="166" font-size="13" fill="#5d5d5d" text-anchor="middle">group()</text>
  <text x="600" y="166" font-size="13" fill="#5d5d5d" text-anchor="middle">word(i) gives a whole word</text>
</svg>
