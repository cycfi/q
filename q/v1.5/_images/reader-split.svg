<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- A MIDI 1.0 byte stream splits where the read ends, not where
       a message ends: the second message arrives in two pieces. -->

  <line x1="60" y1="30" x2="360" y2="30" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="60" y1="24" x2="60" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="360" y1="24" x2="360" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="165" y="18" width="90" height="22" fill="#ffffff"/>
  <text x="210" y="35" font-size="14" fill="#5d5d5d" text-anchor="middle">note on</text>
  <line x1="360" y1="30" x2="660" y2="30" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="360" y1="24" x2="360" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="660" y1="24" x2="660" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="465" y="18" width="90" height="22" fill="#ffffff"/>
  <text x="510" y="35" font-size="14" fill="#5d5d5d" text-anchor="middle">note off</text>
  <rect x="60" y="56" width="100" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0x90</text>
  <rect x="160" y="56" width="100" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0x3C</text>
  <rect x="260" y="56" width="100" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0x64</text>
  <rect x="360" y="56" width="100" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="410" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0x80</text>
  <rect x="460" y="56" width="100" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="510" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0x3C</text>
  <rect x="560" y="56" width="100" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="610" y="83" font-size="16" fill="#1a1a1a" text-anchor="middle">0x40</text>
  <line x1="460" y1="44" x2="460" y2="112" stroke="#d81b60" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="60" y1="138" x2="460" y2="138" stroke="#d81b60" stroke-width="1.5"/>
  <line x1="60" y1="132" x2="60" y2="144" stroke="#d81b60" stroke-width="1.5"/>
  <line x1="460" y1="132" x2="460" y2="144" stroke="#d81b60" stroke-width="1.5"/>
  <rect x="205" y="126" width="110" height="22" fill="#ffffff"/>
  <text x="260" y="143" font-size="14" fill="#d81b60" text-anchor="middle">one read</text>
  <line x1="460" y1="138" x2="660" y2="138" stroke="#d81b60" stroke-width="1.5"/>
  <line x1="460" y1="132" x2="460" y2="144" stroke="#d81b60" stroke-width="1.5"/>
  <line x1="660" y1="132" x2="660" y2="144" stroke="#d81b60" stroke-width="1.5"/>
  <rect x="495" y="126" width="130" height="22" fill="#ffffff"/>
  <text x="560" y="143" font-size="14" fill="#d81b60" text-anchor="middle">the next read</text>
</svg>
