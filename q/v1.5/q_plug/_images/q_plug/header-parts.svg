<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 620 126"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .sub    { font-size: 13px; fill: #5d5d5d; }
      .link   { fill: none; stroke: #1a1a1a; stroke-width: 1.5;
                 stroke-linecap: round; }
      .tip    { fill: #1a1a1a; }
      .frame  { fill: none; stroke: #b0b0b0; stroke-width: 1; }
      .cut    { fill: none; stroke: #b0b0b0; stroke-width: 1.5;
                 stroke-linecap: round; }
    </style>
  </defs>

  <image x="50" y="16" width="350" height="40" xlink:href="data:image/png;base64,"/>
  <rect class="frame" x="50" y="16" width="350" height="40"/>

  <image x="416" y="16" width="150" height="40" xlink:href="data:image/png;base64,"/>
  <rect class="frame" x="416" y="16" width="150" height="40"/>

  <line class="cut" x1="402" y1="60" x2="410" y2="12"/>
  <line class="cut" x1="406" y1="60" x2="414" y2="12"/>

  <line class="link" x1="68" y1="84" x2="68" y2="68"/>
  <polygon class="tip" points="68,58 63,68 73,68"/>
  <text class="sub" x="68" y="100" text-anchor="middle">make_main_menu</text>

  <line class="link" x1="218" y1="104" x2="218" y2="68"/>
  <polygon class="tip" points="218,58 213,68 223,68"/>
  <text class="sub" x="218" y="120" text-anchor="middle">make_preset_menu</text>

  <line class="link" x1="360" y1="84" x2="360" y2="68"/>
  <polygon class="tip" points="360,58 355,68 365,68"/>
  <text class="sub" x="360" y="100" text-anchor="middle">header_items</text>

  <line class="link" x1="528" y1="84" x2="528" y2="68"/>
  <polygon class="tip" points="528,58 523,68 533,68"/>
  <text class="sub" x="528" y="100" text-anchor="middle">make_zoom_buttons</text>
</svg>
