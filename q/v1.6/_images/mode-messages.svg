<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- Controllers 120 and up: one control_change each, which mode_reader
       delivers as a message of its own. The value byte means something
       different in each, or nothing at all. -->

  <text x="170" y="28" font-size="13" fill="#5d5d5d" text-anchor="middle">one control_change</text>
  <text x="550" y="28" font-size="13" fill="#5d5d5d" text-anchor="middle">what mode_reader delivers</text>
  <rect x="20" y="44" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="62" font-size="16" fill="#1a1a1a" text-anchor="middle">0xB0</text>
  <text x="60" y="77" font-size="11" fill="#5d5d5d" text-anchor="middle">status</text>
  <rect x="100" y="44" width="110" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="155" y="62" font-size="16" fill="#1a1a1a" text-anchor="middle">120</text>
  <text x="155" y="77" font-size="11" fill="#5d5d5d" text-anchor="middle">controller</text>
  <rect x="210" y="44" width="110" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="265" y="62" font-size="16" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="265" y="77" font-size="11" fill="#5d5d5d" text-anchor="middle">ignored</text>
  <line x1="322" y1="66" x2="389" y2="66" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="400,66 389,61 389,71" fill="#1a1a1a"/>
  <rect x="400" y="44" width="300" height="44" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="550" y="71" font-size="16" fill="#1a1a1a" text-anchor="middle">all_sound_off</text>
  <rect x="20" y="108" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="126" font-size="16" fill="#1a1a1a" text-anchor="middle">0xB0</text>
  <text x="60" y="141" font-size="11" fill="#5d5d5d" text-anchor="middle">status</text>
  <rect x="100" y="108" width="110" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="155" y="126" font-size="16" fill="#1a1a1a" text-anchor="middle">122</text>
  <text x="155" y="141" font-size="11" fill="#5d5d5d" text-anchor="middle">controller</text>
  <rect x="210" y="108" width="110" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="265" y="126" font-size="16" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="265" y="141" font-size="11" fill="#5d5d5d" text-anchor="middle">off</text>
  <line x1="322" y1="130" x2="389" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="400,130 389,125 389,135" fill="#1a1a1a"/>
  <rect x="400" y="108" width="300" height="44" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <text x="550" y="135" font-size="16" fill="#1a1a1a" text-anchor="middle">local_control</text>
  <rect x="20" y="172" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="190" font-size="16" fill="#1a1a1a" text-anchor="middle">0xB0</text>
  <text x="60" y="205" font-size="11" fill="#5d5d5d" text-anchor="middle">status</text>
  <rect x="100" y="172" width="110" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="155" y="190" font-size="16" fill="#1a1a1a" text-anchor="middle">126</text>
  <text x="155" y="205" font-size="11" fill="#5d5d5d" text-anchor="middle">controller</text>
  <rect x="210" y="172" width="110" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="265" y="190" font-size="16" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="265" y="205" font-size="11" fill="#5d5d5d" text-anchor="middle">channels</text>
  <line x1="322" y1="194" x2="389" y2="194" stroke="#1a1a1a" stroke-width="1.5"/>
