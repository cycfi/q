<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- word 0: 32 bits, 20 px a bit, from x = 70 -->
  <text x="10" y="58" font-size="14" fill="#5d5d5d">word 0</text>

  <rect x="70"  y="30" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">type</text>

  <rect x="150" y="30" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">group</text>

  <rect x="230" y="30" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="270" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">opcode</text>

  <rect x="310" y="30" width="80"  height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="350" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">channel</text>

  <rect x="390" y="30" width="160" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">byte 3</text>

  <rect x="550" y="30" width="160" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="630" y="58" font-size="16" fill="#1a1a1a" text-anchor="middle">byte 4</text>

  <!-- the index: bytes 3 and 4 together -->
  <line x1="390" y1="20" x2="710" y2="20" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="390" y1="14" x2="390" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="710" y1="14" x2="710" y2="26" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="520" y="8" width="60" height="22" fill="#ffffff"/>
  <text x="550" y="25" font-size="14" fill="#5d5d5d" text-anchor="middle">index</text>

  <!-- word 1 -->
  <text x="10" y="138" font-size="14" fill="#5d5d5d">word 1</text>

  <rect x="70" y="110" width="640" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="390" y="138" font-size="16" fill="#1a1a1a" text-anchor="middle">data</text>

  <!-- bit scale -->
  <text x="70"  y="176" font-size="13" fill="#5d5d5d" text-anchor="middle">31</text>
  <text x="230" y="176" font-size="13" fill="#5d5d5d" text-anchor="middle">24</text>
  <text x="390" y="176" font-size="13" fill="#5d5d5d" text-anchor="middle">16</text>
  <text x="550" y="176" font-size="13" fill="#5d5d5d" text-anchor="middle">8</text>
  <text x="710" y="176" font-size="13" fill="#5d5d5d" text-anchor="middle">0</text>
</svg>
