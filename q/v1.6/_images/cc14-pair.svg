<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'>

  <!-- A 7 bit controller is one control_change. A 14 bit controller is
       two, the coarse half on controller n and the fine on n + 32. -->

  <line x1="70" y1="30" x2="370" y2="30" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="70" y1="24" x2="70" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="370" y1="24" x2="370" y2="36" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="145" y="18" width="150" height="22" fill="#ffffff"/>
  <text x="220" y="35" font-size="14" fill="#5d5d5d" text-anchor="middle">one control_change</text>
  <text x="10" y="77" font-size="14" fill="#5d5d5d">7 bit</text>
  <rect x="70" y="50" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">0xB0</text>
  <text x="110" y="83" font-size="11" fill="#5d5d5d" text-anchor="middle">status</text>
  <rect x="150" y="50" width="100" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="200" y="83" font-size="11" fill="#5d5d5d" text-anchor="middle">modulation</text>
  <rect x="250" y="50" width="120" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="68" font-size="16" fill="#1a1a1a" text-anchor="middle">value</text>
  <text x="310" y="83" font-size="11" fill="#5d5d5d" text-anchor="middle">0 to 127</text>
  <line x1="70" y1="140" x2="370" y2="140" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="70" y1="134" x2="70" y2="146" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="370" y1="134" x2="370" y2="146" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="150" y="128" width="140" height="22" fill="#ffffff"/>
  <text x="220" y="145" font-size="14" fill="#5d5d5d" text-anchor="middle">control_change 1</text>
  <line x1="390" y1="140" x2="690" y2="140" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="390" y1="134" x2="390" y2="146" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="690" y1="134" x2="690" y2="146" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="465" y="128" width="150" height="22" fill="#ffffff"/>
  <text x="540" y="145" font-size="14" fill="#5d5d5d" text-anchor="middle">control_change 33</text>
  <text x="10" y="187" font-size="14" fill="#5d5d5d">14 bit</text>
  <rect x="70" y="160" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">0xB0</text>
  <text x="110" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">status</text>
  <rect x="150" y="160" width="100" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="200" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">modulation</text>
  <rect x="250" y="160" width="120" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="310" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">coarse</text>
  <text x="310" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">bits 13 to 7</text>
  <rect x="390" y="160" width="80" height="44" fill="#e8f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="430" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">0xB0</text>
  <text x="430" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">status</text>
  <rect x="470" y="160" width="100" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="520" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">33</text>
  <text x="520" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">modulation, fine</text>
  <rect x="570" y="160" width="120" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="630" y="178" font-size="16" fill="#1a1a1a" text-anchor="middle">fine</text>
  <text x="630" y="193" font-size="11" fill="#5d5d5d" text-anchor="middle">bits 6 to 0</text>
  <line x1="70" y1="234" x2="690" y2="234" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="70" y1="228" x2="70" y2="240" stroke="#5d5d5d" stroke-width="1.5"/>
  <line x1="690" y1="228" x2="690" y2="240" stroke="#5d5d5d" stroke-width="1.5"/>
  <rect x="200" y="222" width="360" height="22" fill="#ffffff"/>
  <text x="380" y="239" font-size="14" fill="#5d5d5d" text-anchor="middle">one value, 0 to 16383, delivered as control_change_14</text>
</svg>
