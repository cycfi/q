<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .box    { stroke-width: 1.5; }
      .actor  { fill: #ffffff; stroke: #5d5d5d; }
      .ui     { fill: #eaf6ea; stroke: #43a047; }
      .hub    { fill: #fff8e1; stroke: #b07000; }
      .host   { fill: #f3f3f3; stroke: #5d5d5d; }
      .label  { font-size: 15px; fill: #1a1a1a; }
      .sub    { font-size: 13px; fill: #5d5d5d; }
      .life   { fill: none; stroke: #b0b0b0; stroke-width: 1;
                 stroke-dasharray: 4 4; }
      .link   { fill: none; stroke: #1a1a1a; stroke-width: 1.5;
                 stroke-linecap: round; }
      .tip    { fill: #1a1a1a; }
      .band   { fill: none; stroke: #b0b0b0; stroke-width: 1;
                 stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect class="box host" x="30" y="14" width="80" height="38" rx="8"/>
  <text class="label" x="70" y="39" text-anchor="middle">host</text>
  <line class="life" x1="70" y1="52" x2="70" y2="310"/>

  <rect class="box actor" x="170" y="14" width="120" height="38" rx="8"/>
  <text class="label" x="230" y="39" text-anchor="middle">plugin</text>
  <line class="life" x1="230" y1="52" x2="230" y2="310"/>

  <rect class="box hub" x="360" y="14" width="120" height="38" rx="8"/>
  <text class="label" x="420" y="39" text-anchor="middle">controller</text>
  <line class="life" x1="420" y1="52" x2="420" y2="310"/>

  <rect class="box ui" x="565" y="14" width="90" height="38" rx="8"/>
  <text class="label" x="610" y="39" text-anchor="middle">control</text>
  <line class="life" x1="610" y1="52" x2="610" y2="310"/>

  <text class="sub" x="14" y="76">audio thread</text>

  <text class="sub" x="150" y="98" text-anchor="middle">param value event</text>
  <line class="link" x1="70" y1="105" x2="220" y2="105"/>
  <polygon class="tip" points="230,105 220,100 220,110"/>

  <text class="sub" x="325" y="128" text-anchor="middle">set_parameter(index, value)</text>
  <line class="link" x1="230" y1="135" x2="410" y2="135"/>
  <polygon class="tip" points="420,135 410,130 410,140"/>

  <text class="sub" x="150" y="158" text-anchor="middle">request_callback</text>
  <line class="link" x1="230" y1="165" x2="80" y2="165"/>
  <polygon class="tip" points="70,165 80,160 80,170"/>

  <line class="band" x1="10" y1="186" x2="690" y2="186"/>
  <text class="sub" x="14" y="205">main thread</text>

  <text class="sub" x="150" y="227" text-anchor="middle">on_main_thread</text>
  <line class="link" x1="70" y1="234" x2="220" y2="234"/>
  <polygon class="tip" points="230,234 220,229 220,239"/>

  <text class="sub" x="325" y="257" text-anchor="middle">update_models()</text>
  <line class="link" x1="230" y1="264" x2="410" y2="264"/>
  <polygon class="tip" points="420,264 410,259 410,269"/>

  <text class="sub" x="515" y="287" text-anchor="middle">the model notifies</text>
  <line class="link" x1="420" y1="294" x2="600" y2="294"/>
  <polygon class="tip" points="610,294 600,289 600,299"/>
</svg>
