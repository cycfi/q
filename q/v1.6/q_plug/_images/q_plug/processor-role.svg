<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270"
  font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .box    { stroke-width: 1.5; }
      .key    { stroke-width: 2.5; }
      .audio  { fill: #e8f2fd; stroke: #1565c0; }
      .hub    { fill: #fff8e1; stroke: #b07000; }
      .ui     { fill: #eaf6ea; stroke: #43a047; }
      .host   { fill: #f3f3f3; stroke: #5d5d5d; }
      .label  { font-size: 18px; fill: #1a1a1a; }
      .sub    { font-size: 13px; fill: #5d5d5d; }
      .link   { fill: none; stroke: #1a1a1a; stroke-width: 1.5;
                 stroke-linecap: round; }
      .tip    { fill: #1a1a1a; }
    </style>
  </defs>

  <rect class="box host" x="20" y="88" width="140" height="74" rx="8"/>
  <text class="label" x="90" y="113" text-anchor="middle">plugin</text>
  <text class="sub" x="90" y="133" text-anchor="middle">host adapter</text>
  <text class="sub" x="90" y="151" text-anchor="middle">CLAP, VST3, AU</text>

  <rect class="box hub" x="250" y="20" width="140" height="46" rx="8"/>
  <text class="label" x="320" y="49" text-anchor="middle">controller</text>

  <rect class="box ui" x="440" y="20" width="140" height="46" rx="8"/>
  <text class="label" x="510" y="49" text-anchor="middle">presenter</text>

  <rect class="key audio" x="250" y="180" width="140" height="66" rx="8"/>
  <text class="label" x="320" y="219" text-anchor="middle">processor</text>

  <path class="link" d="M 115 88 L 115 63 Q 115 43 135 43 L 240 43"/>
  <polygon class="tip" points="250,43 240,38 240,48"/>
  <text class="sub" x="182" y="35" text-anchor="middle">parameter changes</text>

  <line class="link" x1="320" y1="66" x2="320" y2="170"/>
  <polygon class="tip" points="320,180 315,170 325,170"/>
  <text class="sub" x="330" y="128">values</text>

  <line class="link" x1="400" y1="43" x2="430" y2="43"/>
  <polygon class="tip" points="390,43 400,38 400,48"/>
  <polygon class="tip" points="440,43 430,38 430,48"/>
  <text class="sub" x="415" y="33" text-anchor="middle">edits</text>

  <path class="link" d="M 115 162 L 115 177 Q 115 192 130 192 L 240 192"/>
  <polygon class="tip" points="250,192 240,187 240,197"/>
  <text class="sub" x="185" y="186" text-anchor="middle">audio in</text>

  <path class="link" d="M 90 162 L 90 198 Q 90 213 105 213 L 240 213"/>
  <polygon class="tip" points="250,213 240,208 240,218"/>
  <text class="sub" x="185" y="207" text-anchor="middle">MIDI</text>

  <path class="link" d="M 250 234 L 80 234 Q 65 234 65 219 L 65 172"/>
  <polygon class="tip" points="65,162 60,172 70,172"/>
  <text class="sub" x="185" y="228" text-anchor="middle">audio out</text>

  <text class="sub" x="510" y="86" text-anchor="middle">main thread</text>
  <text class="sub" x="320" y="264" text-anchor="middle">audio thread</text>
</svg>
