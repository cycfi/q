name: Build
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'q_plug/**'
      - 'example/q_plug/**'
      - 'test/q_plug/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'q_plug/**'
      - 'example/q_plug/**'
      - 'test/q_plug/**'
env:
  BUILD_TYPE: Release
jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "Windows Latest MSVC"
          # The newest Visual Studio on the image, found by vswhere, so a new
          # VS release on windows-latest does not break the build.
          os: windows-latest
          cc: "cl"
          cxx: "cl"
          msvc: true
        - name: "Ubuntu Latest GCC"
          os: ubuntu-latest
          cc: "gcc"
          cxx: "g++"
        - name: "macOS Latest Clang"
          os: macos-latest
          cpp_version: 20
          cc: "clang"
          cxx: "clang++"
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Install package dependencies
      id: cmake_and_ninja
      shell: cmake -P {0}
      run: |
        if ("${{ runner.os }}" STREQUAL "Windows")
          execute_process(COMMAND choco install ninja)
        elseif ("${{ runner.os }}" STREQUAL "Linux")
          execute_process(COMMAND sudo apt-get update)
          execute_process(COMMAND sudo apt-get install -y ninja-build libasound2-dev)
        elseif ("${{ runner.os }}" STREQUAL "macOS")
          execute_process(COMMAND brew install ninja)
        endif()
    - name: Configure
      shell: cmake -P {0}
      run: |
        set(ENV{CC} ${{ matrix.config.cc }})
        set(ENV{CXX} ${{ matrix.config.cxx }})
        # If we are on windows, run the environment script, parse it with cmake
        # and set environment variables with it (required for Visual Studio)
        if ("${{ matrix.config.msvc }}" STREQUAL "true")
          execute_process(
            COMMAND "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              -latest -products * -property installationPath
            OUTPUT_VARIABLE vs_path
            OUTPUT_STRIP_TRAILING_WHITESPACE
          )
          execute_process(
            COMMAND "${vs_path}/VC/Auxiliary/Build/vcvars64.bat" && set
            OUTPUT_FILE environment_script_output.txt
          )
          file(STRINGS environment_script_output.txt output_lines)
          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        execute_process(
          COMMAND ${CMAKE_COMMAND}
            -S .
            -B build
            -D CMAKE_BUILD_TYPE=$ENV{BUILD_TYPE}
            -G Ninja
            -D CMAKE_MAKE_PROGRAM=ninja
          RESULT_VARIABLE result
          ERROR_VARIABLE error_message
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "Could not run with ${CMAKE_COMMAND}: Got ${error_message} - ${result}")
        endif()
    - name: Build
      shell: cmake -P {0}
      run: |
        # If we are on windows, run the environment script, parse it with cmake
        # and set environment variables with it (required for Visual Studio)
        if ("${{ matrix.config.msvc }}" STREQUAL "true")
          execute_process(
            COMMAND "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              -latest -products * -property installationPath
            OUTPUT_VARIABLE vs_path
            OUTPUT_STRIP_TRAILING_WHITESPACE
          )
          execute_process(
            COMMAND "${vs_path}/VC/Auxiliary/Build/vcvars64.bat" && set
            OUTPUT_FILE environment_script_output.txt
          )
          file(STRINGS environment_script_output.txt output_lines)
          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        execute_process(
          COMMAND ${CMAKE_COMMAND} --build build
          RESULT_VARIABLE result
          ERROR_VARIABLE error_message
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "Could not run with ${CMAKE_COMMAND}: Got ${error_message} - ${result}")
        endif()

    - name: Test
      run: ctest --verbose --test-dir build
      shell: bash

  # Draws the latest develop results of Q's build workflows, pass or fail,
  # as status/build.svg on the www branch (.github/scripts/build_status.sh).
  status:
    name: Status
    needs: build
    if: always() && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        sparse-checkout: .github/scripts

    - name: Draw and publish the build grid
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .github/scripts/build_status.sh
