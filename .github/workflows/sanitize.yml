# Runs Q's tests, QIO's and QPlug's included, under the sanitizers:
# AddressSanitizer with UndefinedBehaviorSanitizer (MSVC has no UBSan, so
# Windows runs ASan alone), and ThreadSanitizer on macOS and Linux. QPlug
# builds on each platform's own drawing backend. The plugin validators are
# left out: they are other programs, not built with the sanitizers, and
# cannot load a plugin that is. TSan also leaves out QIO's device tests,
# whose reports are inside libremidi and RtAudio, on the system's MIDI and
# audio threads. Builds are RelWithDebInfo. The jobs are long, so this runs
# weekly (GitHub schedules only the default branch, which then tests
# develop), by hand, and when this file changes.

name: Sanitize

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sanitize.yml'

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: true

env:
  # The plugin validators.
  EXCLUDE_ASAN: '\.(clap|vst3|au)$'
  # The validators, and QIO's device tests.
  EXCLUDE_TSAN: '\.(clap|vst3|au)$|^test_(midi_loopback|midi2_loopback|midi2_endpoint_loopback|audio_stream)$'

jobs:
  sanitize:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "ASan macOS"
          os: macos-latest
          sanitizer: address
        - name: "ASan Windows"
          os: windows-latest
          sanitizer: address
        - name: "ASan Linux"
          os: ubuntu-latest
          sanitizer: address
        - name: "TSan macOS"
          os: macos-latest
          sanitizer: thread
        - name: "TSan Linux"
          os: ubuntu-latest
          sanitizer: thread

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        # A scheduled run starts from the default branch; test develop.
        ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
        submodules: recursive

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install pkg-config ninja

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja
      shell: cmd

    - name: Resolve MSVC environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
        echo "VCVARS64=$vcvars" >> $env:GITHUB_ENV

    # As q_plug.yml: Cairo and its text stack for Artist, X11 for Elements'
    # host, and ALSA for QIO.
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcairo2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
          libwebp-dev libx11-dev libxcursor-dev libxrandr-dev \
          libasound2-dev pkg-config ninja-build

    - name: Sanitizer flags (macOS, Linux)
      if: runner.os != 'Windows'
      run: |
        if [ "${{ matrix.config.sanitizer }}" = "address" ]; then
          # vptr checks need RTTI, which the prebuilt Skia is built without.
          san="address,undefined"
          extra="-fno-sanitize=vptr -fno-sanitize-recover=undefined"
          echo "EXCLUDE=$EXCLUDE_ASAN" >> $GITHUB_ENV
        else
          san="thread"
          extra=""
          echo "EXCLUDE=$EXCLUDE_TSAN" >> $GITHUB_ENV
        fi
        flags="-fsanitize=$san $extra -fno-omit-frame-pointer"
        for v in CFLAGS CXXFLAGS OBJCXXFLAGS; do echo "$v=$flags" >> $GITHUB_ENV; done
        echo "LDFLAGS=-fsanitize=$san" >> $GITHUB_ENV

    - name: Build and test (macOS, Linux)
      if: runner.os != 'Windows'
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
        # A runner has no display to open an editor on.
        Q_PLUG_SKIP_GUI_TESTS: ${{ runner.os == 'Linux' && '1' || '' }}
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DQ_BUILD_PLUG=ON
        cmake --build build
        ctest --test-dir build --output-on-failure -E "$EXCLUDE"

    - name: Build and test (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        rem The ASan runtime DLL is found on the PATH vcvars sets.
        call "%VCVARS64%" || exit /b 1
        set CFLAGS=/fsanitize=address
        set CXXFLAGS=/fsanitize=address
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQ_BUILD_PLUG=ON || exit /b 1
        cmake --build build || exit /b 1
        ctest --test-dir build --output-on-failure -E "%EXCLUDE_ASAN%"
