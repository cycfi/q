# Builds and tests QPlug on the drawing backends a platform offers besides
# its own, chosen with Elements' switches: Skia everywhere, Cairo on macOS
# and Windows. q_plug.yml covers each platform's own backend on every push;
# these builds are long, so this runs weekly (GitHub schedules only the
# default branch, master), by hand, and when this file changes. Linux
# runners have no display, so its editor tests are skipped.

name: q_plug backends

on:
  push:
    paths:
      - '.github/workflows/q_plug-backends.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q_plug-backends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    # The slowest platform takes about 25 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "macOS Skia"
          os: macos-latest
          backend: ELEMENTS_SKIA
        - name: "macOS Cairo"
          os: macos-latest
          backend: ELEMENTS_CAIRO
        - name: "Windows Skia"
          os: windows-latest
          backend: ELEMENTS_SKIA
        - name: "Windows Cairo"
          os: windows-latest
          backend: ELEMENTS_CAIRO
        - name: "Linux Skia"
          os: ubuntu-latest
          backend: ELEMENTS_SKIA

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install pkg-config ninja

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ninja
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
        echo "VCVARS64=$vcvars" >> $env:GITHUB_ENV

    # QPlug's packages, and the OpenGL headers Skia needs.
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libfontconfig1-dev libfreetype6-dev \
           libharfbuzz-dev libwebp-dev libx11-dev libxcursor-dev libxrandr-dev \
           libasound2-dev pkg-config ninja-build \
           libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev

    - name: Build and Test (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQ_BUILD_PLUG=ON -D${{ matrix.config.backend }}=ON
        cmake --build build
        ctest --test-dir build --output-on-failure

    # The runner has no GPU, and Windows' own OpenGL is 1.1, too old for Skia
    # to open an editor. Mesa's opengl32.dll beside each validator takes the
    # place of the system's, and draws with llvmpipe.
    - name: Mesa software OpenGL (Windows Skia)
      if: runner.os == 'Windows' && matrix.config.backend == 'ELEMENTS_SKIA'
      shell: bash
      run: |
        curl -sSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
        7z x -omesa mesa.7z x64 > /dev/null
        ls mesa/x64

    - name: Build and Test (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        call "%VCVARS64%" || exit /b 1
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQ_BUILD_PLUG=ON -D${{ matrix.config.backend }}=ON -DQ_PLUG_VALIDATOR_DIR=%CD%\validators || exit /b 1
        if exist mesa\x64 for /r validators %%f in (*.exe) do copy /y mesa\x64\*.dll "%%~dpf" >nul
        cmake --build build || exit /b 1
        ctest --test-dir build --output-on-failure || exit /b 1

    - name: Build and Test (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQ_BUILD_PLUG=ON -D${{ matrix.config.backend }}=ON
        cmake --build build
        Q_PLUG_SKIP_GUI_TESTS=1 ctest --test-dir build --output-on-failure

  # Draws the latest develop results of Q's build workflows, pass or fail,
  # as status/build.svg on the www branch (.github/scripts/build_status.sh).
  status:
    name: Status
    needs: build
    if: always() && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        sparse-checkout: .github/scripts

    - name: Draw and publish the build grid
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .github/scripts/build_status.sh
